name: Land Banker CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:test
      - run: npm exec playwright -- install --with-deps chromium
      - run: npm run local:start
      - run: npm run build
      - name: Verify real local field and copy workflows
        run: |
          npm run start > /tmp/land-banker-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/ >/dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-browser-screenshots
          path: artifacts/*.png
  ios:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/project.yml --project ios
      - name: Build unsigned Simulator app
        env:
          DEVICE_KIND: ${{ matrix.device }}
          LAND_BANKER_WEB_URL: ${{ vars.LAND_BANKER_WEB_URL }}
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys,os; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith(os.environ["DEVICE_KIND"])))')
          xcodebuild -project ios/LandBanker.xcodeproj -scheme LandBanker -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath ios/Build CODE_SIGNING_ALLOWED=NO LAND_BANKER_WEB_URL="${LAND_BANKER_WEB_URL:-https://configure-preview.invalid/app/map}" build
      - uses: actions/upload-artifact@v4
        with:
          name: land-banker-${{ matrix.device }}-simulator
          path: ios/Build/Build/Products/Debug-iphonesimulator/*.app
