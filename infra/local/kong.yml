_format_version: '2.1'
_transform: true
services:
  - name: auth
    url: http://auth:9999/
    routes:
      - name: auth
        strip_path: true
        paths: [/auth/v1/]
  - name: rest
    url: http://rest:3000/
    routes:
      - name: rest
        strip_path: true
        paths: [/rest/v1/]
  - name: storage
    url: http://storage:5000/
    routes:
      - name: storage
        strip_path: true
        paths: [/storage/v1/]
plugins:
  - name: cors
    config:
      origins: ['http://localhost:3000', 'http://127.0.0.1:3000']
      credentials: true
      headers: [Authorization, Content-Type, apikey, x-client-info, x-upsert, x-supabase-api-version]
      methods: [GET, POST, PATCH, PUT, DELETE, OPTIONS]
