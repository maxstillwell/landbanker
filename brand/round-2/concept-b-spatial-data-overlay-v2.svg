<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">LandOS Spatial Data Overlay app icon</title>
  <desc id="desc">Three spatial data layers with an active lime parcel and connected data nodes</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1D"/>
      <stop offset="0.52" stop-color="#121A2C"/>
      <stop offset="1" stop-color="#1A253B"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D4FC34"/>
      <stop offset="1" stop-color="#84CC16"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D4FC34"/>
      <stop offset="0.55" stop-color="#10B981"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="middle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#1E293B" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- The source stays square; iOS applies its own rounded mask. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#A3E635" stroke-width="3" fill="none">
    <path d="M-110 214C166 137 382 310 1134 186"/>
    <path d="M-100 358C238 257 574 458 1134 318"/>
    <path d="M-92 522C212 451 674 656 1135 487"/>
    <path d="M-100 704C310 602 756 825 1138 682"/>
    <path d="M-104 868C236 787 657 964 1134 837"/>
  </g>
  <ellipse cx="512" cy="804" rx="350" ry="96" fill="#000814" opacity="0.46"/>
  <g transform="translate(0 126)">
    <polygon points="512,496 806,646 512,796 218,646" fill="url(#bottom)" stroke="#3B82F6" stroke-width="5" stroke-opacity="0.58"/>
    <path d="m365 571 294 150m0-150L365 721m147-225v300" stroke="#60A5FA" stroke-width="3" stroke-opacity="0.34" stroke-dasharray="10 10"/>
  </g>
  <g transform="translate(0 34)">
    <polygon points="512,414 806,564 512,714 218,564" fill="url(#middle)" stroke="#10B981" stroke-width="6" stroke-opacity="0.76"/>
    <path d="m365 489 294 150m-220-188 294 150M512 414v300" stroke="#34D399" stroke-width="3" stroke-opacity="0.38"/>
  </g>
  <g transform="translate(0 -64)">
    <polygon points="512,330 806,480 512,630 218,480" fill="#142034" fill-opacity="0.56" stroke="url(#edge)" stroke-width="9" filter="url(#soft-glow)"/>
    <polygon points="512,330 659,405 586,443 512,405 438,443 365,405" fill="url(#active)"/>
    <polygon points="512,405 586,443 512,481 438,443" fill="#D4FC34"/>
    <polygon points="586,443 733,518 659,556 512,481" fill="url(#active)" opacity="0.72"/>
    <path d="m365 405 294 151M512 330v300m-220-188 294 151" stroke="#0A0F1D" stroke-width="5" stroke-opacity="0.7"/>
    <path d="M512 405v-104m147 104 62-50" stroke="#D4FC34" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8"/>
    <circle cx="512" cy="291" r="25" fill="#D4FC34" filter="url(#soft-glow)"/>
    <circle cx="512" cy="291" r="10" fill="#0D131F"/>
    <circle cx="733" cy="345" r="18" fill="#A3E635"/>
    <circle cx="438" cy="443" r="13" fill="#10B981"/>
    <circle cx="586" cy="443" r="13" fill="#D4FC34"/>
  </g>
</svg>
