name: LandBanker
options:
  bundleIdPrefix: com.landbanker
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    LANDOS_BUNDLE_IDENTIFIER: com.landbanker.app
    LANDOS_DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "$(LANDOS_DEVELOPMENT_TEAM)"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    LAND_BANKER_WEB_URL: "https://landbanker.vercel.app/app/map"
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      VALIDATE_PRODUCT: YES
targets:
  LandBanker:
    type: application
    platform: iOS
    sources:
      - LandBanker
    info:
      path: LandBanker/Info.plist
      properties:
        CFBundleDisplayName: LandOS
        UILaunchScreen: {}
        LAND_BANKER_WEB_URL: "$(LAND_BANKER_WEB_URL)"
        NSLocationWhenInUseUsageDescription: LandOS uses your location to place field observations and show where you are on the map.
        NSCameraUsageDescription: Take photos to attach to your field observations.
        NSPhotoLibraryUsageDescription: Choose photos for field observations and preserve their capture information.
        UISupportedInterfaceOrientations:
          [
            UIInterfaceOrientationPortrait,
            UIInterfaceOrientationLandscapeLeft,
            UIInterfaceOrientationLandscapeRight,
          ]
        UISupportedInterfaceOrientations~ipad:
          [
            UIInterfaceOrientationPortrait,
            UIInterfaceOrientationPortraitUpsideDown,
            UIInterfaceOrientationLandscapeLeft,
            UIInterfaceOrientationLandscapeRight,
          ]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(LANDOS_BUNDLE_IDENTIFIER)"
        CODE_SIGN_ENTITLEMENTS: LandBanker/LandBanker.entitlements
schemes:
  LandBanker:
    archive:
      config: Release
    build:
      targets:
        LandBanker: all
